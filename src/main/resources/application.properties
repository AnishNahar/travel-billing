spring.application.name=travel-billing
server.port=${PORT:8080}

# File-backed H2 (not in-memory): data survives restarts. Override the location with DB_PATH.
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/travel-billing};LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.generator.write-bigdecimal-as-plain=true
spring.jackson.serialization.write-dates-as-timestamps=false

spring.mvc.problemdetails.enabled=false
